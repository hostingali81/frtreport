# Signing for release builds. This is a copy of the machine's debug keystore,
# promoted to "the" app key: existing installs were debug-signed, so keeping the
# same key lets the in-app updater install over them. The passwords are the
# well-known Android debug defaults — fine for private (non-Play-Store)
# distribution, but NEVER lose this file: an APK signed with a different key
# will not install over existing installs.
storePassword=android
keyPassword=android
keyAlias=androiddebugkey
storeFile=frt-upload.keystore
