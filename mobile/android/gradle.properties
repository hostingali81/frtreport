org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Pub cache lives on C: while this project is on D:. Kotlin's incremental
# compiler relativizes plugin source paths against the build dir and throws
# "different roots" across drives, which fails release builds. Disable it.
kotlin.incremental=false
