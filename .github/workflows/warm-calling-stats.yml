name: Warm Calling Stats (manual backstop)

# The scheduled warming now runs on pg_cron INSIDE the database -- see migration
# 20260903180000. GitHub's scheduler cannot be relied on for short intervals on
# this repo: frt-refresh.yml asks for every 5 minutes and its last 20 scheduled
# runs averaged a 239-minute gap, and this workflow's own */15 schedule never
# fired once. pg_cron has no scheduler to be throttled and no runner to boot.
#
# Kept as a manual escape hatch: run it from the Actions tab if pg_cron is ever
# disabled, or to force a refresh after changing the preset ranges.
on:
  workflow_dispatch:

concurrency:
  group: warm-calling-stats
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # supabase-js >= 2.110 needs Node 22+ (native WebSocket); on 20 it
          # throws "native WebSocket not found" at createClient().
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci

      - name: Warm preset stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npx tsx scripts/warm-calling-stats.ts
