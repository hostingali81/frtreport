name: Daily Full Scrape

on:
  schedule:
    # Runs at 21:30 UTC every day (approx 3:00 AM IST)
    # This runs slightly after the Vercel cron to ensure we have a comprehensive backup
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date for manual test/run (YYYY-MM-DD)'
        required: false
        default: '2025-11-01'
      end_date:
        description: 'End date for manual test/run (YYYY-MM-DD). Leave blank for today IST.'
        required: false
        default: ''
      max_retries:
        description: 'Max attempts per month. Use 0 for unlimited until job timeout.'
        required: false
        default: '5'

concurrency:
  group: full-scrape
  cancel-in-progress: false

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        env:
          # The API-replay scraper needs no browser; if a session recapture is
          # required it uses the runner's preinstalled Google Chrome instead of
          # downloading Chromium (~170MB) on every run.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm ci

      - name: Run Full Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          FRT_USERNAME: ${{ secrets.FRT_USERNAME }}
          FRT_PASSWORD: ${{ secrets.FRT_PASSWORD }}
          FRT_LOGIN_TYPE: ${{ secrets.FRT_LOGIN_TYPE || vars.FRT_LOGIN_TYPE || '' }}
          FULL_SCRAPE_START_DATE: ${{ github.event.inputs.start_date || '2025-11-01' }}
          FULL_SCRAPE_END_DATE: ${{ github.event.inputs.end_date || '' }}
          FULL_SCRAPE_MAX_RETRIES: ${{ github.event.inputs.max_retries || '5' }}
          FULL_SCRAPE_RETRY_DELAY_MS: '30000'
          FULL_SCRAPE_SESSION_RETRY_DELAY_MS: '120000'
          # 3 months in parallel x 2 requests per month = 6 in-flight report
          # calls against the FRT server. Writes: 100-row batches, 3 at a
          # time - each written row pays trigram-index maintenance, so bigger
          # batches hit the 8s statement timeout.
          FULL_SCRAPE_MONTH_CONCURRENCY: '3'
          FRT_API_CONCURRENCY: '2'
          SUPABASE_LOOKUP_CONCURRENCY: '6'
          SUPABASE_UPSERT_CONCURRENCY: '3'
          SUPABASE_UPSERT_BATCH_SIZE: '100'
          SCRAPER_PROTOCOL_TIMEOUT_MS: '600000'
          SCRAPER_LOAD_TIMEOUT_MS: '300000'
        run: npx tsx scripts/full-scrape.ts
