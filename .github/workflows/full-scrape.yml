name: Daily Full Scrape

on:
  schedule:
    # Runs at 00:30 UTC every day (approx 6:00 AM IST)
    # This runs slightly after the Vercel cron to ensure we have a comprehensive backup
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date for manual test/run (YYYY-MM-DD)'
        required: false
        default: '2025-11-01'
      end_date:
        description: 'End date for manual test/run (YYYY-MM-DD). Leave blank for today IST.'
        required: false
        default: ''
      max_retries:
        description: 'Max attempts per month. Use 0 for unlimited until job timeout.'
        required: false
        default: '5'

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 Hours max

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          FRT_USERNAME: ${{ secrets.FRT_USERNAME }}
          FRT_PASSWORD: ${{ secrets.FRT_PASSWORD }}
          FULL_SCRAPE_START_DATE: ${{ github.event.inputs.start_date || '2025-11-01' }}
          FULL_SCRAPE_END_DATE: ${{ github.event.inputs.end_date || '' }}
          FULL_SCRAPE_MAX_RETRIES: ${{ github.event.inputs.max_retries || '5' }}
          FULL_SCRAPE_RETRY_DELAY_MS: '30000'
          FULL_SCRAPE_SESSION_RETRY_DELAY_MS: '120000'
          SCRAPER_PROTOCOL_TIMEOUT_MS: '600000'
          SCRAPER_LOAD_TIMEOUT_MS: '300000'
        run: npx tsx scripts/full-scrape.ts
